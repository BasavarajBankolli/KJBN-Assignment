# Render blueprint for the backend API (https://render.com).
# Uses the backend/Dockerfile. Deploy the frontend separately on Vercel.
services:
  - type: web
    name: food-truck-finder-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATASF_BASE_URL
        value: https://data.sfgov.org/resource/rqzj-sfat.json
      - key: DATASF_TIMEOUT_SECONDS
        value: "10"
      - key: CACHE_TTL_SECONDS
        value: "300"
      # Replace with your deployed frontend origin.
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://kjbn-assignment.vercel.app